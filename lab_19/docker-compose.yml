version: "3.9"

services:
  menu-service:
    build: ./menu-service
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  order-service:
    build: ./order-service
    ports:
      - "8002:8002"
    environment:
      - MENU_SERVICE_URL=http://menu-service:8001
      - DELIVERY_SERVICE_URL=http://delivery-service:8003
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    depends_on:
      - menu-service
      - delivery-service

  delivery-service:
    build: ./delivery-service
    ports:
      - "8003:8003"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - MENU_URL=http://menu-service:8001
      - ORDER_URL=http://order-service:8002
      - DELIVERY_URL=http://delivery-service:8003
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    depends_on:
      - menu-service
      - order-service
      - delivery-service