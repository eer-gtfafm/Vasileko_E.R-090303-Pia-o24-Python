{% extends "base.html" %}
{% block title %}Добавить блюдо{% endblock %}
{% block content %}
<h1>Добавить блюдо</h1>
<form method="post" class="form">
    <label>Название <input type="text" name="name" required></label>
    <label>Описание <textarea name="description" rows="2"></textarea></label>
    <label>Категория
        <select name="category_id" required>
            {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Цена, ₽ <input type="number" name="price" step="0.01" min="0.01" required></label>
    <label>Калорийность, ккал <input type="number" name="calories" min="0" value="0"></label>
    <label class="check"><input type="checkbox" name="available" value="1" checked> Доступно</label>
    <button type="submit" class="btn">Сохранить</button>
</form>
{% endblock %}
