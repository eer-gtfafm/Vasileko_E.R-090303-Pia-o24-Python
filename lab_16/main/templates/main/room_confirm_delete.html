{% extends "base.html" %}
{% block title %}Удаление номера{% endblock %}
{% block content %}
<h1>Удаление номера {{ object.number }}</h1>
<p>Вы действительно хотите удалить номер {{ object.number }}? Это действие нельзя отменить.</p>
<form method="post" class="form">
    {% csrf_token %}
    <button type="submit" class="btn danger">Удалить</button>
    <a class="btn" href="{% url 'room_list' %}">Отмена</a>
</form>
{% endblock %}
